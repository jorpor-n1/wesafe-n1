<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--cl:205px;--cv:82px;--navy:#1a237e;--sp:#7b1fa2;--xs:#00796b}
body{font-family:'Sarabun',sans-serif;background:#f0f2f5;color:#1a1a2e;font-size:15px}
#root{min-height:100vh}
.wrap{max-width:1240px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:18px;margin-bottom:16px}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--navy);color:#fff}.btn.pri:hover:not(:disabled){background:#283593}
.btn.ok{background:#2e7d32;color:#fff}.btn.ok:hover:not(:disabled){background:#1b5e20}
.btn.red{background:#c62828;color:#fff}
.btn.out{background:#fff;border:1.5px solid #c5cae9;color:#1a237e}.btn.out:hover{background:#f5f6ff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.inp{padding:6px 8px;border:2px solid #c5cae9;border-radius:8px;font-size:15px;font-family:inherit;font-weight:700;text-align:center;width:84px;background:#fff}
.inp:focus{outline:none;border-color:var(--navy);background:#eef0ff}
.inp.miss{border-color:#ffa726;background:#fff8e1}
.inp.txt{text-align:left;font-weight:600;width:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:10px;border:none;background:#e8eaf6;color:#1a237e;font-weight:700;font-family:inherit;font-size:14px;cursor:pointer}
.tab.on{background:var(--navy);color:#fff}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;color:#fff;vertical-align:middle}
.ucode{color:#8a8fa8;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{background:#37474f;color:#fff;padding:7px 8px;font-weight:700;white-space:nowrap}
.tbl td{padding:6px 8px;border-bottom:1px solid #eceff1;text-align:center}
.tbl td.l{text-align:left;font-weight:600}
.tbl tr:hover td{background:#fafbff}
.uz{border:3px dashed #b0b8e0;border-radius:16px;padding:44px 24px;text-align:center;background:#fff;cursor:pointer;transition:all .2s}
.uz:hover,.uz.dg{border-color:var(--navy);background:#eef0ff}
.xs-wrap{overflow-x:auto;padding-bottom:6px}
.xs-lbl{position:absolute;left:50%;top:6px;transform-origin:0 0;transform:rotate(-90deg) translate(-100%,-50%);font-size:11.5px;font-weight:600;white-space:nowrap;color:#37474f;line-height:1.2}
.famnav{display:flex;flex-direction:column;gap:6px}
.fam{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:10px;border:2px solid transparent;background:#f5f6fa;cursor:pointer;font-family:inherit;text-align:left;width:100%}
.fam:hover{background:#eef0ff}
.fam.on{border-color:var(--navy);background:#e8eaf6}
.ucard{border:2px solid #e0e3f0;border-radius:14px;margin-bottom:14px;overflow:hidden;background:#fff}
.uhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;color:#fff;flex-wrap:wrap}
.ubody{padding:12px 14px}
.step{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px dashed #e3e6f0}
.num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:#eceff1;color:#37474f}
.hint{font-size:12.5px;color:#6b7280}
.stepbar{display:flex;gap:8px;flex-wrap:wrap}
.sb{flex:1;min-width:150px;padding:10px 12px;border-radius:12px;background:#eceff1;color:#78909c;font-weight:700;font-size:14px;border:none;font-family:inherit;text-align:left;cursor:pointer}
.sb.on{background:var(--navy);color:#fff}.sb.done{background:#e8f5e9;color:#2e7d32}
.sticky{position:sticky;top:0;z-index:20}
.edgrid>*{min-width:0}
.thr-legend{display:none;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
@media(max-width:900px){.navcard{position:static!important}.edgrid{grid-template-columns:1fr!important}.famnav{flex-direction:row;overflow-x:auto;padding-bottom:4px}.fam{min-width:170px}}
@media(max-width:700px){:root{--cl:112px;--cv:64px}.ucode{display:none}.wrap{padding:10px}.card{padding:13px}.hide-m{display:none}
  .seg span{font-size:10px}.seg-sm span{display:none}.thr-label{display:none}.thr-legend{display:flex}.chart-pad{padding-top:6px!important}}

/* ══ อ่านไฟล์ data.xlsx (รวมทั้งเขตในไฟล์เดียว) ══ */
function readWorkbook(wb){
  const sh=wb.Sheets[wb.SheetNames[0]];const raw=XLSX.utils.sheet_to_json(sh,{header:1});
  const f0=String(raw[0]?.[0]||"");const mM=f0.match(/Month\D+(\d+)/i);const yM=f0.match(/Year\D+(\d+)/i);
  const month=mM?parseInt(mM[1]):null,year=yM?parseInt(yM[1]):null;
  let hi=-1;for(let i=0;i<Math.min(raw.length,10);i++){if(raw[i]?.includes?.("PEA_Name")||raw[i]?.[0]==="PEA_Name"){hi=i;break;}}
  if(hi<0)return{error:"ไม่พบหัวคอลัมน์ PEA_Name — ตรวจสอบว่าเป็นไฟล์ที่ export จาก WeSafe"};
  const cm={};raw[hi].forEach((h,i)=>{if(h)cm[String(h).trim()]=i;});
  const ci={pea:cm["PEA_Name"]??0,type:cm["ประเภทงาน"]??4,sup:cm["ผู้ควบคุมงาน"]??9,date:cm["วันเวลา(เปิดงาน)"]??2};
  const sup={};let mx=0,matched=0,all=0;
  raw.slice(hi+1).forEach(r=>{
    if(!r||!r[ci.pea]||r[ci.pea]==="PEA_Name")return;all++;
    const dm=String(r[ci.date]||"").match(/(\d{2})\/\d{2}\/\d{4}/);if(dm)mx=Math.max(mx,parseInt(dm[1]));
    const uid=NM[String(r[ci.pea]).trim()];if(!uid)return;matched++;
    const nm=norm(r[ci.sup])||"(ไม่ระบุชื่อ)";const isO=String(r[ci.type]||"").trim()===OMS_T;
    if(!sup[uid])sup[uid]={};const a=sup[uid][nm]||(sup[uid][nm]=[0,0]);a[0]++;if(isO)a[1]++;
  });
  const currentDay=mx||(month&&year?new Date(year,month,0).getDate():30);
  return{month,year,currentDay,sup,matched,all};
}
/* นับผลงานรายหน่วยจากชื่อช่าง (ตรรกะเดียวกับระบบของแต่ละหน่วย) */
function computeOd(sup,csnObj,hotlines){
  const CSN=new Set();Object.values(csnObj||{}).forEach(a=>(a||[]).forEach(n=>{const k=norm(n);if(k)CSN.add(k);}));
  const HL=new Set((hotlines||[]).map(norm).filter(Boolean));
  const od={};
  UNITS.forEach(u=>{const d={total:0,oms:0,pspm:0,wms:0};const s=(sup&&sup[u.id])||{};
    Object.entries(s).forEach(([nm,v])=>{const t=toInt(v&&v[0]),o=toInt(v&&v[1]);if(HL.has(nm))return;d.total+=t;d.oms+=o;if(CSN.has(nm))d.pspm+=t-o;});
    d.wms=d.total-d.oms-d.pspm;od[u.id]=d;});
  return od;
}
const omsCalc=(inc,day,dim,pct)=>{const est=day>0?Math.round(toInt(inc)*(dim/day)):0;return{est,target:Math.round(est*pct/100)};};
const psAuto=(csn,uid)=>((csn&&csn[uid])||[]).filter(n=>norm(n)).length*PS_PER;
function kpiLS(d,ps,oms,wms){const p=ps||16;const ot=Math.max(oms||1,.01);const w=wms||14;
  const rP=Math.min((d.pspm/p)*.41,.41),yP=Math.min((d.oms/ot)*.41,.41),gP=Math.min((d.wms/w)*.21,.21);
  return{rP,yP,gP,kpi:rP+yP+gP,p,ot,w};}
function buildRows(md){
  const od=md.officeData||{};const z={total:0,oms:0,pspm:0,wms:0};
  const ls=LSU.map(u=>{const d=od[u.id]||z;return{...u,d,...kpiLS(d,md.psPmTargets?.[u.id],md.omsTargets?.[u.id],md.wmsTargets?.[u.id])};});
  const xt=toInt(md.xsTarget)||12;
  const xs=XUN.map(u=>{const d=od[u.id]||z;return{...u,d,actual:d.total,target:xt,pct:d.total/xt};});
  return{M:ls.filter(r=>r.grp==="M"),S:ls.filter(r=>r.grp==="S"),X:xs,xt};
}

        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap",marginBottom:10}}>
          <div style={{fontWeight:800,fontSize:17,color:"#1a237e"}}>ตรวจทานค่าที่กรอก (แม่ 18 + S 30) <span className="hint">— คลิกแถวเพื่อกลับไปแก้</span></div>
          {totalMiss>0?<span className="chip" style={{background:"#fff3e0",color:"#e65100"}}>ยังไม่ครบ {totalMiss} หน่วย</span>:<span className="chip" style={{background:"#e8f5e9",color:"#2e7d32"}}>ครบทุกหน่วย ✓</span>}</div>
        <ReviewTable ctx={ctx} goFam={goFam}/></div>
      <div className="card" style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap",border:"2px solid #2e7d32"}}>
        <div style={{fontWeight:700}}>{totalMiss>0?<span style={{color:"#e65100"}}>⚠ ยังกรอกไม่ครบ {totalMiss} หน่วย — บันทึกไว้ก่อนได้ แล้วกลับมาแก้ในเมนู "ข้อมูลรายเดือน"</span>:"พร้อมบันทึก — ตรวจกราฟด้านล่างก่อนกดบันทึก"}</div>
        {!confirmSave?<button className="btn ok" disabled={saving} onClick={()=>totalMiss>0?setConfirmSave(true):doSave()}>💾 บันทึกข้อมูลเดือน {TM[month]}</button>
          :<div style={{display:"flex",gap:8}}><button className="btn ok" disabled={saving} onClick={doSave}>{saving?"กำลังบันทึก...":"ยืนยันบันทึก (ยังไม่ครบ)"}</button><button className="btn out" onClick={()=>setConfirmSave(false)}>ยกเลิก</button></div>}</div>
      <div style={{fontWeight:800,color:"#455a64",margin:"4px 2px 8px"}}>ตัวอย่างหน้า Dashboard</div>
      <RegionDash md={preview}/>
    </div>}
  </div>);
}

/* ══ หน้าแอดมิน ══ */
function Uploader({onLoad}){
  const [dg,setDg]=useState(false);const [err,setErr]=useState(null);const [busy,setBusy]=useState(false);const ref=useRef();
  const read=f=>{if(!f)return;setBusy(true);setErr(null);const r=new FileReader();
    r.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});const res=readWorkbook(wb);
      if(res.error){setErr(res.error);}else if(!res.month||!res.year){setErr("ไม่พบเดือน/ปีในเซลล์ A1 ของไฟล์ (Month เป็น../Year เป็น..)");}else onLoad({...res,fname:f.name});}
      catch(x){setErr("อ่านไฟล์ไม่ได้: "+x.message);}setBusy(false);};r.readAsArrayBuffer(f);};
  return(<div>
    <div className={"uz"+(dg?" dg":"")} onClick={()=>ref.current?.click()} onDragOver={e=>{e.preventDefault();setDg(true);}} onDragLeave={()=>setDg(false)} onDrop={e=>{e.preventDefault();setDg(false);read(e.dataTransfer.files[0]);}}>
      <div style={{fontSize:44}}>📥</div><div style={{fontSize:19,fontWeight:800,color:"#1a237e",marginTop:6}}>{busy?"กำลังอ่านไฟล์...":"นำเข้าไฟล์ data.xlsx จาก WeSafe"}</div>
      <div className="hint" style={{fontSize:14,marginTop:6}}>ไฟล์เดียวครอบคลุมทั้ง 92 การไฟฟ้า • คลิกหรือลากไฟล์มาวาง</div>
      <input ref={ref} type="file" accept=".xlsx,.xls" style={{display:"none"}} data-upload="1" onChange={e=>{read(e.target.files[0]);e.target.value="";}}/></div>
    {err&&<div className="card" style={{marginTop:12,background:"#ffebee",color:"#b71c1c",fontWeight:700}}>⛔ {err}</div>}
  </div>);}
function MonthsList({allD,onEdit,onView}){
  const keys=validMonthKeys(allD).reverse();const [del,setDel]=useState(null);
  if(!keys.length)return <div className="card" style={{textAlign:"center",color:"#888",padding:30}}>ยังไม่มีข้อมูลที่บันทึก</div>;
  return(<div className="card"><table className="tbl"><thead><tr><th style={{textAlign:"left"}}>เดือน</th><th>ข้อมูล ณ วันที่</th><th className="hide-m">ใบงานทั้งเขต</th><th className="hide-m">บันทึกล่าสุด</th><th>จัดการ</th></tr></thead>
    <tbody>{keys.map(k=>{const d=allD[k];const miss=LSU.filter(u=>!isFilled(d.omsIncidents?.[u.id])).length;return(<tr key={k}>
      <td className="l">{TM[d.month]} {ty(d.year)} {miss>0&&<span className="badge" style={{background:"#ffa726"}}>ขาด OMS {miss}</span>}</td><td>{d.currentDay}</td>
      <td className="hide-m">{(d.totalRows||0).toLocaleString()}</td><td className="hide-m hint">{d.savedAt?new Date(d.savedAt).toLocaleString("th-TH"):""} {d.savedBy}</td>
      <td style={{whiteSpace:"nowrap"}}><button className="btn sm out" onClick={()=>onView(k)}>ดู</button> <button className="btn sm pri" onClick={()=>onEdit(k)}>แก้ไข</button>{" "}
        {del===k?<><button className="btn sm red" onClick={async()=>{await db.ref(DB_ROOT+"/months/"+k).remove();await db.ref(DB_ROOT+"/sup/"+k).remove();setDel(null);}}>ยืนยันลบ</button> <button className="btn sm out" onClick={()=>setDel(null)}>ยกเลิก</button></>
          :<button className="btn sm" style={{background:"#ffebee",color:"#c62828"}} onClick={()=>setDel(k)}>ลบ</button>}</td></tr>);})}</tbody></table></div>);}
function Admin({user,allD,loaded,settings}){
  const [tab,setTab]=useState("import");const [session,setSession]=useState(null);const [viewKey,setViewKey]=useState(null);const [loadErr,setLoadErr]=useState(null);
  const openFile=res=>{const k=mkey(res.year,res.month);setSession({...res,existing:allD[k]||null});};
  const openSaved=async k=>{setLoadErr(null);try{const snap=await db.ref(DB_ROOT+"/sup/"+k).once("value");const sup=snap.val()?decKeys(snap.val()):null;const d=allD[k];
    if(!sup){setLoadErr("เดือนนี้ไม่มีข้อมูลรายชื่อช่างที่บันทึกไว้ — กรุณานำเข้าไฟล์ data ของเดือนนี้ใหม่");return;}
    setSession({month:d.month,year:d.year,currentDay:d.currentDay,sup,fname:"แก้ไขข้อมูลที่บันทึกไว้",existing:d});setTab("import");}catch(e){setLoadErr(e.message);}};
  return(<div>
    <div style={{background:"linear-gradient(135deg,#1a237e,#283593)",color:"#fff"}}><div className="wrap" style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap",paddingTop:12,paddingBottom:12}}>
      <div><div style={{fontSize:19,fontWeight:800}}>⚡ WeSafe KPI — กฟน.1 (ระดับเขต)</div><div style={{fontSize:13,opacity:.8}}>แม่ 18 · S 30 · XS 44 การไฟฟ้า</div></div>
      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}><span style={{fontSize:13,opacity:.85}}>{user.email}</span>
        <a className="btn sm" style={{background:"rgba(255,255,255,.18)",color:"#fff",textDecoration:"none"}} href="?view=1" target="_blank" rel="noopener">🌐 หน้า Dashboard</a>
        <button className="btn sm" style={{background:"#fff",color:"#1a237e"}} onClick={()=>auth.signOut()}>ออกจากระบบ</button></div></div></div>
    <div className="wrap">
      <div className="tabs" style={{marginBottom:14}}>
        {[["import","📥 นำเข้า & กรอกข้อมูล"],["months","🗂 ข้อมูลรายเดือน"],["dash","📊 Dashboard"]].map(([k,l])=><button key={k} className={"tab"+(tab===k?" on":"")} onClick={()=>setTab(k)}>{l}</button>)}</div>
      {loadErr&&<div className="card" style={{background:"#ffebee",color:"#b71c1c",fontWeight:700}}>⛔ {loadErr}</div>}
      {tab==="import"&&(session?<Editor key={mkey(session.year,session.month)+(session.fname||"")} session={session} settings={settings} user={user} onClose={()=>setSession(null)} onSaved={()=>{}}/>
        :<div><div style={{marginBottom:14}}><StepBar step={1} setStep={()=>{}} canReview={false}/></div><Uploader onLoad={openFile}/>
          <div className="card hint" style={{marginTop:14,fontSize:14,lineHeight:1.8}}><b style={{color:"#37474f"}}>ขั้นตอน:</b> ① นำเข้าไฟล์ data ของเดือน → ② กรอกจำนวนเหตุ OMS, ชื่อช่าง PS/PM และเป้า WMS ทีละการไฟฟ้าแม่ (18 ชุด) → ③ ตรวจทานแล้วกดบันทึก<br/>
            ชื่อช่าง เป้า PS/PM และเป้า WMS จะถูกจำไว้ใช้เดือนถัดไป ส่วนจำนวนเหตุ OMS ต้องกรอกใหม่ทุกเดือน</div></div>)}
      {tab==="months"&&<MonthsList allD={allD} onEdit={openSaved} onView={k=>{setViewKey(k);setTab("dash");}}/>}
      {tab==="dash"&&(viewKey&&allD[viewKey]?<div><div style={{marginBottom:10}}><button className="btn sm out" onClick={()=>setViewKey(null)}>← เลือกเดือนอื่น</button></div><RegionDash md={allD[viewKey]}/></div>:<DashView allD={allD} loaded={loaded}/>)}
    </div></div>);}

function Login(){
  const [err,setErr]=useState(null);
  return(<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20,background:"linear-gradient(135deg,#1a237e,#5e35b1)"}}>
    <div className="card" style={{maxWidth:420,width:"100%",textAlign:"center",padding:30}}>
      <div style={{fontSize:46}}>⚡</div><div style={{fontSize:22,fontWeight:800,color:"#1a237e"}}>WeSafe KPI — กฟน.1</div><div className="hint" style={{marginBottom:20}}>ระบบรวมผลทั้งเขต (แอดมิน)</div>
      <button className="btn pri" style={{width:"100%",justifyContent:"center",padding:12,fontSize:16}} onClick={()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>setErr(e.message))}>เข้าสู่ระบบด้วย Google</button>
      {err&&<div style={{color:"#c62828",marginTop:10,fontSize:13}}>{err}</div>}
      <a href="?view=1" style={{display:"block",marginTop:16,color:"#3949ab",fontWeight:700}}>ดู Dashboard (ไม่ต้องเข้าสู่ระบบ)</a></div></div>);}
function PublicView({allD,loaded}){
  return(<div>
    <div style={{background:"linear-gradient(135deg,#1a237e,#283593)",color:"#fff"}}><div className="wrap" style={{paddingTop:14,paddingBottom:14}}>
      <div style={{fontSize:20,fontWeight:800}}>⚡ WeSafe KPI Dashboard — กฟน.1</div><div style={{fontSize:13,opacity:.8}}>ผลการเปิดใบงาน WeSafe ทั้งเขต: การไฟฟ้าแม่ 18 · สาขา S 30 · สาขา XS 44</div></div></div>
    <div className="wrap"><DashView allD={allD} loaded={loaded}/></div></div>);}

function App(){
  const [user,setUser]=useState(null),[authReady,setAuthReady]=useState(false);
  const [allD,setAllD]=useState({}),[loaded,setLoaded]=useState(false),[settings,setSettings]=useState({});
  useEffect(()=>auth.onAuthStateChanged(u=>{setUser(u);setAuthReady(true);}),[]);
  useEffect(()=>{const r=db.ref(DB_ROOT+"/months");r.on("value",s=>{const v=s.val();setAllD(v?decKeys(v):{});setLoaded(true);},()=>setLoaded(true));return()=>r.off();},[]);
  useEffect(()=>{if(isPublicView)return;const r=db.ref(DB_ROOT+"/settings");r.on("value",s=>{const v=s.val();setSettings(v?decKeys(v):{});});return()=>r.off();},[]);
  if(isPublicView)return <PublicView allD={allD} loaded={loaded}/>;
  if(!authReady)return <div style={{padding:40,textAlign:"center",color:"#888"}}>กำลังโหลด...</div>;
  if(!user)return <Login/>;
  return <Admin user={user} allD={allD} loaded={loaded} settings={settings}/>;
}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
